name: Build desktop test packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    defaults:
      run:
        working-directory: Causerie
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
#     matrix:
#       include:
#         - os: ubuntu-22.04
#           name: linux-x64
#           args: --bundles deb,appimage
#         - os: windows-latest
#           name: windows-x64
#           args: --bundles nsis
#         - os: macos-latest
#           name: macos-universal
#           args: --target universal-apple-darwin --bundles dmg

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libssl-dev libdbus-1-dev build-essential

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Causerie/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: Causerie/src-tauri -> target
          key: ${{ matrix.name }}

      - run: npm ci

      - name: Configure macOS ad-hoc signing
        if: runner.os == 'macOS'
        run: echo 'APPLE_SIGNING_IDENTITY=-' >> "$GITHUB_ENV"

      - name: Build packages
        run: npm run tauri -- build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: causerie-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
          path: |
            Causerie/src-tauri/target/release/bundle/deb/*.deb
            Causerie/src-tauri/target/release/bundle/appimage/*.AppImage
            Causerie/src-tauri/target/release/bundle/nsis/*-setup.exe
            Causerie/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
