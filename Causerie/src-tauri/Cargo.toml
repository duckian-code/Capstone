[package]
name = "causerie"
version = "1.0.0"
description = "AI-driven language acquisition platform."
authors = ["Lily McClellan"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "causerie_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

tauri-plugin-shell = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
dotenv = "0.15.0"
openai_rust_sdk = "2.0.1"
futures = "0.3.34"
serde = { version = "1.0.229", features = ["derive"] }
tauri-plugin-log = "2"
log = "0.4.34"
serde_json = "1.0.154"
tauri-plugin-stronghold = "2"
getrandom = "0.2"
zeroize = "1"
fs2 = "0.4"
tauri-plugin-single-instance = "2"
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }


[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
